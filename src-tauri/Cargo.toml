[package]
name = "tabler"
version = "0.1.0"
description = "Tabler - a desktop database client for PostgreSQL, MySQL/MariaDB and SQLite"
authors = ["Ocean Space <developer@oceanspace.co.id>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tabler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["release-drivers"]
# The drivers beyond PostgreSQL, MySQL and SQLite that release builds include (each lane's
# feature is added here once it lands). Every driver's code sits behind its `drv-*` feature, so a
# build without one compiles none of it and reports the driver as not built.
release-drivers = []
all-drivers = [
    "drv-pg-flavors",
    "drv-libsql",
    "drv-d1",
    "drv-duckdb",
    "drv-sqlserver",
    "drv-clickhouse",
    "drv-snowflake",
    "drv-bigquery",
    "drv-vertica",
    "drv-cassandra",
    "drv-redis",
    "drv-mongodb",
    "drv-elasticsearch",
    "drv-dynamodb",
]
# Transport shared by several drivers (`drivers::common`).
common-http = ["dep:bytes", "dep:percent-encoding"]
common-aws = ["common-http", "dep:hex"]
common-jwt = ["common-http"]
drv-pg-flavors = []
drv-libsql = ["common-http"]
drv-d1 = ["common-http"]
drv-duckdb = ["dep:duckdb"]
drv-sqlserver = ["dep:tiberius", "tokio-util/compat"]
drv-clickhouse = ["common-http"]
drv-snowflake = ["dep:snowflake-connector-rs"]
drv-bigquery = ["common-jwt"]
drv-vertica = ["dep:tokio-rustls", "dep:md-5", "dep:bytes", "dep:hex"]
drv-cassandra = ["dep:scylla", "dep:num-bigint", "dep:bigdecimal", "dep:bytes"]
drv-redis = ["dep:redis", "dep:tokio-rustls", "dep:bytes"]
drv-mongodb = ["dep:mongodb", "dep:percent-encoding"]
drv-elasticsearch = ["common-aws"]
drv-dynamodb = ["common-aws"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
# Native notifications when a long export / import / backup finishes in the background.
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process"] }
tokio-util = "0.7"
futures = "0.3"
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
rustls = "0.23"
rustls-native-certs = "0.8"
deadpool-postgres = "0.14"
russh = "0.64"
keyring = "4"
thiserror = "2"
log = "0.4"
base64 = "0.23"
csv = "1"
async-trait = "0.1"
regex = "1"
# SQLCipher (encrypted SQLite, b100): bundled, with CommonCrypto on macOS (no OpenSSL needed).
rusqlite = { version = "0.40", features = ["bundled-sqlcipher", "column_decltype", "column_metadata"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ts-rs = { version = "12", features = ["uuid-impl", "chrono-impl"] }
# Import / export: .sql.gz files and the deflate streams of .xlsx workbooks (already in the lock).
flate2 = "1"
# Connection export files: AES-256-GCM + PBKDF2 (already built for rustls).
aws-lc-rs = "1.18"
# SASLprep of PostgreSQL passwords for client-side SCRAM verifiers (already in the lock via tokio-postgres).
stringprep = "0.1"
# SQLite over SSH: the SFTP client (and, in tests, server) on top of russh channels.
russh-sftp = "3.0"
# The SSH tunnel's peer check (which process owns a local connection) and the SFTP cache.
libc = "0.2"
# AI Assistant: HTTPS to the Claude API / OpenAI-compatible servers / Ollama, streamed
# (rustls with aws-lc-rs and the platform verifier; already in the lock via tauri).
# `system-proxy`: the macOS System Settings proxy (a Finder-launched app has no HTTPS_PROXY).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "system-proxy"] }

# The drivers beyond PostgreSQL, MySQL and SQLite. Every crate here is optional and only `drv-*`
# or `common-*` features turn it on, so a default build compiles none of them. TLS is rustls on
# aws-lc-rs throughout: no ring, OpenSSL or native-tls (tests/manifest_features.rs guards that).
# Versions are the newest release at least 14 days old when added; an `=` pin keeps a later
# resolve from taking a newer release before anyone has checked it.
# SQL Server (TDS 8 with rustls, NTLM on Windows, SQL Browser for named instances).
tiberius = { version = "0.13", optional = true, default-features = false, features = ["tds80", "rustls", "winauth", "sql-browser-tokio", "chrono"] }
# DuckDB from its bundled C++ sources (no system library), with JSON and Parquet. The build
# script of libduckdb-sys pulls in ureq with rustls on ring; that stays in the build script and
# never reaches the app (`cargo tree -e normal,features -i rustls` shows no "ring").
duckdb = { version = "=1.10506.0", optional = true, default-features = false, features = ["bundled", "json", "parquet"] }
# Snowflake over REST, with key-pair (JWT) sign-in.
snowflake-connector-rs = { version = "=1.1.0", optional = true, default-features = false, features = ["key-pair-auth"] }
# Cassandra and ScyllaDB; varint and decimal values decode into num-bigint and bigdecimal.
scylla = { version = "1.9", optional = true, features = ["rustls-023", "num-bigint-04", "bigdecimal-04"] }
num-bigint = { version = "0.4", optional = true }
bigdecimal = { version = "0.4", optional = true }
# Redis and Valkey: the async client only; the driver wraps TLS itself with tokio-rustls.
redis = { version = "=1.7.1", optional = true, default-features = false, features = ["tokio-comp"] }
# MongoDB: its default `rustls-tls` uses ring, so aws-lc-rs is chosen explicitly.
mongodb = { version = "3.9.1", optional = true, default-features = false, features = ["compat-3-0-0", "rustls-tls-aws-lc", "dns-resolver"] }
# TLS streams on the app's rustls config (Redis, Vertica); already in the lock.
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["tls12", "logging"] }
# Vertica's MD5 password hash (SHA-512 comes from aws-lc-rs); already in the lock.
md-5 = { version = "0.11", optional = true }
# Already in the lock through other crates; direct for the drivers that use them.
bytes = { version = "1", optional = true }
percent-encoding = { version = "2", optional = true }
hex = { version = "0.4", optional = true }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.dev]
incremental = true

# Compile dependencies with light optimization in dev: faster runtime, compiled once.
[profile.dev.package."*"]
opt-level = 1

# DuckDB's C++ compiled with debug info (`/Z7` on MSVC) makes the test binaries too big to link
# comfortably in 16 GB; nobody steps through DuckDB itself.
[profile.dev.package.libduckdb-sys]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

# SQLCipher's crypto: CommonCrypto on macOS, OpenSSL elsewhere. Windows has no system OpenSSL, so
# it is built from source and linked in statically (needs Perl and NASM at build time).
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
# The SSH tunnel's check for a wildcard listener on a pinned port: a dual-stack `[::]` probe
# needs IPV6_V6ONLY off (already in the lock via tokio).
socket2 = "0.6"

# Touch ID (LocalAuthentication) and the sleep / screen-lock notifications of the app lock
# (already in the lock via tao / wry).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
# MySQL "Old" driver (Ver. menu): TLS 1.0 / 1.1 through Secure Transport. rustls (the default
# connector) speaks TLS 1.2 and 1.3 only. `legacy-tls` exists only in the vendored mysql_async.
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls", "legacy-tls"] }

[dev-dependencies]
tempfile = "3"
# Paused-clock tests (`#[tokio::test(start_paused = true)]`) of timeouts and cancel retries.
tokio = { version = "1", features = ["test-util"] }

# The real-server suites of the driver lanes (dev/lanes.json) are built only with their lane's
# feature: a build without it skips them instead of parsing them, so a lane's unfinished suite
# never breaks `cargo test` or `clippy --all-targets` of the other builds.
[[test]]
name = "pg_flavors"
required-features = ["drv-pg-flavors"]

[[test]]
name = "libsql"
required-features = ["drv-libsql"]

[[test]]
name = "d1"
required-features = ["drv-d1"]

[[test]]
name = "duckdb"
required-features = ["drv-duckdb"]

[[test]]
name = "clickhouse"
required-features = ["drv-clickhouse"]

[[test]]
name = "sqlserver"
required-features = ["drv-sqlserver"]

[[test]]
name = "snowflake"
required-features = ["drv-snowflake"]

[[test]]
name = "bigquery"
required-features = ["drv-bigquery"]

[[test]]
name = "vertica"
required-features = ["drv-vertica"]

[[test]]
name = "dynamodb"
required-features = ["drv-dynamodb"]

[[test]]
name = "cassandra"
required-features = ["drv-cassandra"]

[[test]]
name = "redis"
required-features = ["drv-redis"]

[[test]]
name = "mongodb"
required-features = ["drv-mongodb"]

[[test]]
name = "elasticsearch"
required-features = ["drv-elasticsearch"]

# mysql_async 0.37.1, vendored: its rustls verifier never skips the host name check because it
# looks for the text "NotValidForName" in an error rustls 0.23 words differently, so MySQL
# VERIFY-CA behaved like VERIFY-IDENTITY. The patch matches the typed error (see
# vendor/mysql_async/Cargo.toml for the list of changes). Drop it once upstream does.
[patch.crates-io]
mysql_async = { path = "vendor/mysql_async" }
