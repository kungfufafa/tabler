[package]
name = "tabler"
version = "0.1.0"
description = "Tabler - a desktop database client for PostgreSQL, MySQL/MariaDB and SQLite"
authors = ["Ocean Space <developer@oceanspace.co.id>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tabler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tokio-util = "0.7"
futures = "0.3"
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
rustls = "0.23"
rustls-native-certs = "0.8"
deadpool-postgres = "0.14"
russh = "0.64"
keyring = "4"
thiserror = "2"
log = "0.4"
base64 = "0.23"
csv = "1"
async-trait = "0.1"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ts-rs = { version = "12", features = ["uuid-impl", "chrono-impl"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.dev]
incremental = true

# Compile dependencies with light optimization in dev: faster runtime, compiled once.
[profile.dev.package."*"]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[dev-dependencies]
tempfile = "3"
