# pg-ssl (dev/docker-compose.yml, profile "ssl"): TCP only over TLS, client certificates checked.
# TYPE   DATABASE  USER         ADDRESS  METHOD
local    all       all                   trust
# Certificate only: CN must equal the user (clientcert=verify-full is implied by `cert`).
hostssl  all       tabler_cert  all      cert
# Password + a client certificate signed by the trusted CA (CN not checked).
hostssl  all       tabler_ca    all      scram-sha-256 clientcert=verify-ca
# Password + a client certificate whose CN is the user.
hostssl  all       tabler_full  all      scram-sha-256 clientcert=verify-full
# Password over TLS, no client certificate.
hostssl  all       tabler       all      scram-sha-256
host     all       all          all      reject
