name: Release installers

# Installers for macOS and Windows, for anyone to download and install:
#   - every push to `main` (but docs-only ones): the installers replace the ones on the rolling
#     `nightly` pre-release, once CI has passed on that same commit (a red commit builds, but is
#     never published). A newer push cancels the build of the one before it;
#   - push a `v*` tag (`git tag v0.1.0 && git push origin v0.1.0`): a GitHub Release for that tag,
#     with the installers attached and release notes generated from the commits;
#   - run it from the Actions tab with "publish" set to `nightly`: the installers replace the ones
#     on the rolling `nightly` pre-release (https://github.com/<owner>/<repo>/releases/tag/nightly);
#   - run it with "publish" left at `artifacts`: the installers only hang off the run, as artifacts
#     (a GitHub login to download, gone after 90 days).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Where the installers go"
        type: choice
        default: artifacts
        options: [artifacts, nightly]
  push:
    branches: [main]
    tags: ["v*"]
    # Docs and design sources change no installer (tags ignore path filters).
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "design/**"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Installer · ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One .app / .dmg for Apple Silicon and Intel.
          - os: macos-latest
            name: macos
            label: macOS (.dmg)
            args: --target universal-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          # The NSIS setup .exe and the .msi (src-tauri/tauri.windows.conf.json).
          - os: windows-latest
            name: windows
            label: Windows (.msi, .exe)
            args: ""
            bundle: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    # A cold build compiles every driver, DuckDB's C++ included, twice on macOS (both architectures).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # rustup picks the channel and components from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable

      - name: Intel target for the universal macOS build
        if: matrix.name == 'macos'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
          # Keep the compiled dependencies even when a later step fails, so the next run starts warm.
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # rusqlite builds the vendored OpenSSL on Windows (SQLCipher); its configure script needs a
      # Windows Perl. The runner's default shell is pwsh, where Strawberry Perl comes first on PATH.
      - name: Perl for the vendored OpenSSL
        if: matrix.name == 'windows'
        shell: pwsh
        run: echo "OPENSSL_SRC_PERL=$((Get-Command perl.exe).Source)" >> $env:GITHUB_ENV

      - name: Build the installer
        run: pnpm tauri build ${{ matrix.args }}

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: tabler-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  release:
    name: Publish · ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') || inputs.publish == 'nightly' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Room to wait for CI on the commit (it can outlast the installer builds).
    timeout-minutes: 60
    permissions:
      contents: write
      # Reads the CI run of the commit (`gh run list` / `gh run watch`).
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
    steps:
      - uses: actions/checkout@v4

      # A push to main publishes only a commit CI passed (check.yml runs on every push to main).
      # Manual runs and tags publish as before.
      - name: Wait for CI on this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          id=""
          for _ in $(seq 1 30); do
            id=$(gh run list --workflow check.yml --commit "$GITHUB_SHA" --event push --json databaseId -q '.[0].databaseId')
            [ -n "$id" ] && break
            sleep 10
          done
          if [ -z "$id" ]; then echo "::error::No CI run found for $GITHUB_SHA"; exit 1; fi
          gh run watch "$id" --exit-status --interval 30 > /dev/null
          echo "CI passed on ${GITHUB_SHA::7}"

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # The Windows artifact keeps its `msi/` and `nsis/` folders (upload-artifact keeps the
      # common parent of several paths); the release wants the files alone.
      - name: Installers to publish
        run: |
          find installers -mindepth 2 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -exec mv -t installers {} +
          find installers -mindepth 1 -type d -exec rm -r {} +
          ls -l installers

      # The nightly pre-release is one rolling release: its tag moves to this commit and the
      # installers replace the previous ones. A `v*` tag gets a release of its own, with notes
      # generated from the commits since the previous tag.
      - name: Create or update the release
        run: |
          set -euo pipefail
          if [ "$TAG" = nightly ]; then
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            gh release create nightly installers/* \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Nightly ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
              --notes "$(printf 'Built from `%s` on `main`. Unsigned builds: see the README for the first-launch steps on macOS (Gatekeeper) and Windows (SmartScreen).' "${GITHUB_SHA::7}")"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            # A release made by hand for the tag (a draft, say): just attach the installers.
            gh release upload "$TAG" installers/* --clobber
          else
            gh release create "$TAG" installers/* \
              --verify-tag \
              --title "Tabler $TAG" \
              --generate-notes
          fi
