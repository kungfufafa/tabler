name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The toolchain targets aarch64-apple-darwin and Tauri needs no extra system packages here.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # rustup picks the channel, components and target from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Renderer — typecheck, lint, format, tests
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test
          pnpm test:lanes

      - name: Rust — fmt, clippy, tests
        # Integration tests self-skip while the TABLER_TEST_* URLs are unset.
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          pnpm clippy
          pnpm test:rs

      - name: Generated TypeScript bindings are committed
        # `cargo test` rewrote src/lib/ipc/bindings; a diff means a ts-rs type changed without
        # its binding being committed.
        run: git diff --exit-code -- src/lib/ipc/bindings

  features:
    # The builds the job above never makes: without the optional drivers, and with every driver
    # lane (dev/lanes.json) at once, DuckDB's C++ included. A lane must build on its own and next
    # to all the others.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust without the optional drivers — clippy, lib tests
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --no-default-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --lib

      - name: Bindings are the same without the optional drivers
        run: git diff --exit-code -- src/lib/ipc/bindings

      - name: Rust with every driver — clippy, lib tests
        # The bindings go to a folder of their own, for the next step to compare both ways.
        env:
          TS_RS_EXPORT_DIR: ${{ runner.temp }}/bindings-all
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features --lib

      - name: Bindings are the ones every driver exports
        # The shared bindings and the lanes' committed ones (`<Prefix>*.ts`, `lex/<d>.json`, which
        # `lane.mjs <lane> bindings` writes) must be what the build with every driver exports, and
        # none may be left over from a type that is gone. A lane's binding that is not committed
        # yet only warns: it is committed with the lane's code, at the latest when the lane lands.
        run: |
          out="$RUNNER_TEMP/bindings-all"
          git diff --no-index --exit-code --diff-filter=MD -- src/lib/ipc/bindings "$out"
          added=$(git diff --no-index --name-only --diff-filter=A -- src/lib/ipc/bindings "$out" || true)
          for f in $added; do echo "::warning::binding not committed yet: ${f#"$out"/}"; done

  check-windows:
    # The same checks on Windows, which build.yml also ships.
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # LF files as in the repository: prettier expects LF, and CRLF copies would make every
      # generated binding differ from what `cargo test` writes.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Renderer — typecheck, lint, format, tests
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test
          pnpm test:lanes

      # rusqlite builds the vendored OpenSSL here (SQLCipher), with `perl` from PATH unless
      # OPENSSL_SRC_PERL says otherwise. Under bash that is Git's MSYS perl, which cannot build
      # it; under pwsh Strawberry Perl comes first, as in build.yml. (Get-Command, not
      # `(where.exe perl)[0]`: a single match is a string, and [0] its first letter.)
      - name: Perl for the vendored OpenSSL
        shell: pwsh
        run: echo "OPENSSL_SRC_PERL=$((Get-Command perl.exe).Source)" >> $env:GITHUB_ENV

      - name: Rust — fmt, clippy, tests
        # The password command and bootstrap script tests written for sh run through the login
        # shell: Git Bash is it here (the cmd.exe default has tests of its own).
        env:
          SHELL: 'C:\Program Files\Git\bin\bash.exe'
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          pnpm clippy
          pnpm test:rs

      - name: Generated TypeScript bindings are committed
        run: git diff --exit-code -- src/lib/ipc/bindings
