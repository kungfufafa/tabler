# ts-rs writes generated TypeScript bindings here when `cargo test` runs in src-tauri.
# 64-bit integers are exported as `number`: serde_json emits them as JSON numbers and every i64/u64
# field in the IPC types is either small (counts, ids) or already a string (`Value::BigInt`).
[env]
TS_RS_EXPORT_DIR = { value = "src/lib/ipc/bindings", relative = true }
TS_RS_LARGE_INT = "number"
